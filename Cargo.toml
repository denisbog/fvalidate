[package]
name = "fast-csv"
version = "0.1.0"
edition = "2021"
description = "Fast, xan-style CSV column validation with a small rule DSL"
license = "MIT"

[[bin]]
name = "fvalidate"
path = "src/main.rs"

[[bin]]
name = "fview"
path = "src/bin/fview.rs"
required-features = ["gui"]

[[bin]]
name = "fgen"
path = "src/bin/fgen.rs"

[features]
default = []
# Optional GUI viewer (browse rows + evaluate rules). Build with
# `cargo run --features gui --bin fview`.
gui = ["dep:egui", "dep:eframe", "dep:egui_extras", "dep:rfd", "dep:toml", "dep:dirs", "dep:memmap2"]

[dependencies]
simd-csv = "0.14"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
egui = { version = "0.36", optional = true }
egui_extras = { version = "0.36", optional = true, default-features = false, features = ["svg"] }
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "default_fonts",
    "wgpu",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
rfd = { version = "0.17", optional = true }
memmap2 = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "4", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
